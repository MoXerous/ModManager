# مجلد إخراج أنواع TypeScript التي يولّدها ts-rs عند تشغيل cargo test.
# ts-rs يلحق القيمة على مجلد العمل الحالي (CWD) وقت تنفيذ الاختبارات —
# لذا شغّل cargo دائماً من جذر المستودع فيكون المخرج src/bindings حتماً.
# لا تغيّر القيمة إلى ../ مهما حدث: ذلك يسرّب الملفات خارج المستودع.
# الوجهة الوحيدة الملتزمة: src/bindings (تستورد منها الواجهة).
[env]
TS_RS_EXPORT_DIR = { value = "src/bindings", relative = true }
