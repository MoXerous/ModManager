name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      # يقرأ إصدار pnpm من حقل packageManager في package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # يُولّد أيضاً أنواع TypeScript في src/bindings
      - name: Rust tests
        run: cargo test --workspace

      - name: Generated bindings are committed and up to date
        if: runner.os == 'Linux'
        run: test -z "$(git status --porcelain -- src/bindings)"

      - name: Frontend typecheck and build
        run: pnpm build

  # M1's gate (foundations.md §10.2): install a real mod set from the command
  # line, on both systems, with every hash verified. Nothing else here proves
  # that — the rest of the suite runs against wiremock, so the download path,
  # the streaming hasher and the atomic commit have never touched the network.
  #
  # The expected hash is fetched from Modrinth and compared with a platform
  # hasher, so this grades the downloader against the publisher rather than
  # against our own code.
  verify-real-download:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # A slug pinned to a released version so a yank upstream fails loudly here
      # instead of silently passing on someone else's file.
      - name: Install a real mod set from the command line
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mm-gate'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          cargo run -q -p mm-cli -- install sodium lithium --game 1.21.1 --loader fabric --instance $dir --yes

      - name: The downloaded bytes match what Modrinth publishes
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'mm-gate'
          $lock = Get-Content (Join-Path $dir 'instance.lock.json') -Raw | ConvertFrom-Json
          if ($lock.entries.Count -ne 2) { throw "expected 2 locked mods, got $($lock.entries.Count)" }

          foreach ($slug in @('sodium', 'lithium')) {
            $url = "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%221.21.1%22%5D&loaders=%5B%22fabric%22%5D"
            $entry = $lock.entries | Where-Object { $_.slug -eq $slug }
            $remote = (Invoke-RestMethod $url) | Where-Object { $_.id -eq $entry.version_id }
            # Guarded rather than assumed: an empty or renamed response must
            # fail here, not leave `$published` null for a comparison that would
            # then grade nothing.
            if ($null -eq $remote) { throw "${slug} - version $($entry.version_id) not returned by Modrinth" }
            $published = $remote.files | Where-Object { $_.filename -eq $entry.filename }
            if ($null -eq $published) { throw "${slug} - file $($entry.filename) not in that version" }
            $jar = Join-Path $dir "mods/$($entry.filename)"
            if (-not (Test-Path $jar)) { throw "${slug} was locked but never written" }

            $actual = (Get-FileHash $jar -Algorithm SHA512).Hash.ToLower()
            if ($actual -ne $published.hashes.sha512) { throw "${slug} SHA-512 does not match Modrinth" }
            # The lock must carry the hash that was verified, not only the
            # collision-broken one.
            if ($entry.sha512 -ne $published.hashes.sha512) { throw "${slug} lock did not record sha512" }
            Write-Host "${slug} ok: $($entry.filename)"
          }

      - name: No partial file survived the commit
        shell: pwsh
        run: |
          $left = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'mm-gate') -Recurse -Filter '*.part')
          if ($left.Count -ne 0) { throw "partial files left behind: $($left.FullName)" }

