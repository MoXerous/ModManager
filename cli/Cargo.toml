[package]
name = "mm-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "modmanager"
path = "src/main.rs"

[dependencies]
mm-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
zip = "9.0.4"
sha1 = "0.11.0"
sha2 = "0.11.1"
serde_json = "1.0.154"
