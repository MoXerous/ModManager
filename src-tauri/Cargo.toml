[package]
name = "modmanager-tauri"
version.workspace = true
edition.workspace = true
description = "ModManager"
authors = ["ModManager contributors"]
license = ""

[lib]
name = "modmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
mm-core = { path = "../core" }

[dev-dependencies]
tempfile = "3.27.0"
