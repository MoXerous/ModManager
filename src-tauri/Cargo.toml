[package]
name = "modmanager-tauri"
version.workspace = true
edition.workspace = true
description = "ModManager"
authors = ["ModManager contributors"]
license = ""

[lib]
name = "modmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
mm-core = { path = "../core" }
tauri-plugin-dialog = "2"
# Not a new download: mm-core already depends on it. The bridge names the type
# because `modpack::archive::read_pack` takes a `zip::ZipArchive<R>` — the pack
# commands have to open the file themselves, and inventing a second reader in
# core just to hide this type would be the seam for its own sake.
zip = "9.0.4"

[dev-dependencies]
tempfile = "3.27.0"
# `test` is an empty feature: it adds no dependency and downloads nothing. It
# brings `tauri::test::mock_builder`, which is how `execute_install` gets
# driven through a real `tauri::ipc::Channel` without a window and without a
# person clicking anything. The Channel path was otherwise covered only by
# reasoning.
wiremock = "0.6.5"
# Both already in the workspace through mm-core, so neither downloads anything.
# The fixture has to be a real zip (the verifier checks ZIP magic on a .jar)
# and its sha512 has to be computed, not guessed, or the download correctly
# fails verification and the test proves nothing.
sha2 = "0.11.1"
sha1 = "0.11.0"
