[package]
name = "modmanager-tauri"
version.workspace = true
edition.workspace = true
description = "ModManager"
authors = ["ModManager contributors"]
license = ""

[lib]
name = "modmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
mm-core = { path = "../core" }
tauri-plugin-dialog = "2"
# Not a new download: mm-core already depends on it. The bridge names the type
# because `modpack::archive::read_pack` takes a `zip::ZipArchive<R>` — the pack
# commands have to open the file themselves, and inventing a second reader in
# core just to hide this type would be the seam for its own sake.
zip = "9.0.4"
# Not a new download: `mm-core` already depends on it and this crate already
# used it in tests. The pack commands hash the archive they read (SHA-512) so a
# file swapped between the plan and the apply is refused, which is a production
# need, not a test one.
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
# Both are already in the workspace at these exact versions, and `cargo` reuses
# the compiled crates: core's own tests already build tokio with `macros` and
# mm-core depends on async-trait. The export command tests need them to drive
# core's async `Provider` trait without a network.
tokio = { version = "1.53.3", features = ["macros", "rt"] }
async-trait = "0.1.92"
# `test` is an empty feature: it adds no dependency and downloads nothing. It
# brings `tauri::test::mock_builder`, which is how `execute_install` gets
# driven through a real `tauri::ipc::Channel` without a window and without a
# person clicking anything. The Channel path was otherwise covered only by
# reasoning.
wiremock = "0.6.5"
# Not a new download: mm-core already depends on this exact version with these
# features, so the compiled library is reused. The legacy scan tests need to
# create a real old-format database; fabricating one through another API would
# prove the mapping against a shape the old application never wrote.
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
# Already in the workspace through mm-core, so it downloads nothing. The
# fixture has to be a real zip (the verifier checks ZIP magic on a .jar) and
# its sha1 has to be computed, not guessed, or the download correctly fails
# verification and the test proves nothing.
sha1 = "0.11.0"
