[package]
name = "mm-core"
version.workspace = true
edition.workspace = true
publish = false

# لا تبعيات في M0 عمداً: تُضاف كل مكتبة مع أول وحدة تحتاجها.
[dependencies]
directories = "6.0.0"
# fs2: only std-free way to probe free disk space (F-023 preflight).
# Kept over hand-rolled FFI: 93M downloads, exact on Windows junctions.
fs2 = "0.4.3"
httpdate = "1.0.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rusqlite_migration = "2.6.0"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
unicode-normalization = "0.1.25"
zip = "9.0.4"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
